name: Chat runtime bundle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pinned source
        run: python -m unittest discover -v
      - name: Verify public scenario and handoff
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          revision="$(git rev-parse HEAD)"
          python play.py start campaigns/civic-recovery/campaign.json service-restoration "$work/opening.json"
          cp "$work/opening.json" "$work/session.json"
          python play.py submit "$work/session.json" restore_service_center --actor coordinator
          python play.py advance "$work/session.json" --actor coordinator
          python chat_handoff.py export "$work/session.json" "$work/handoff.json" --engine-revision "$revision"
          python chat_handoff.py restore "$work/handoff.json" "$work/restored.json" --engine-revision "$revision"
          cmp <(python -m json.tool --sort-keys "$work/session.json") <(python -m json.tool --sort-keys "$work/restored.json")
          python play.py finish "$work/restored.json" --actor coordinator
          python play.py inspect "$work/restored.json" --actor coordinator
          python play.py start campaigns/civic-recovery/campaign.json community-assistance "$work/linked.json" --from-session "$work/restored.json"
          python play.py inspect "$work/linked.json" --actor coordinator
      - name: Export exact tracked public source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chat-bundle"
          revision="$(git rev-parse HEAD)"
          if git ls-files | grep -E '^(private/|tools/simwar/)' ; then
            echo "Private scenario content is tracked in the public runner" >&2
            exit 1
          fi
          git archive --format=zip --prefix=age-simwar-runner/ --output="$RUNNER_TEMP/chat-bundle/runner-source.zip" "$revision"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path(__import__("os").environ["RUNNER_TEMP"]) / "chat-bundle/runner-source.zip"
          with ZipFile(archive) as z:
              forbidden = [name for name in z.namelist()
                           if name.startswith(("age-simwar-runner/private/", "age-simwar-runner/tools/simwar/"))]
              if forbidden:
                  raise SystemExit("Private paths in public bundle: " + ", ".join(forbidden))
          PY
          printf '%s\n' "$revision" > "$RUNNER_TEMP/chat-bundle/ENGINE_REVISION.txt"
          cd "$RUNNER_TEMP/chat-bundle"
          sha256sum runner-source.zip > SHA256SUMS
          cp "$GITHUB_WORKSPACE/00_Meta/STANDALONE_PLAY.md" START_HERE.md
      - name: Verify extracted offline package
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/chat-bundle"
          cd "$bundle"
          sha256sum -c SHA256SUMS
          test -s START_HERE.md
          work="$(mktemp -d)"
          python -m zipfile -e runner-source.zip "$work"
          cd "$work/age-simwar-runner"
          python -m unittest discover -v
          python game.py list
          python play.py private bundled-catalog > "$work/strategic-catalog.json"
          python - "$work/strategic-catalog.json" <<'PY'
          import json, sys
          campaigns = json.load(open(sys.argv[1]))
          assert len(campaigns) == 2
          assert sum(len(c["episodes"]) for c in campaigns) == 8
          assert sum(len(e["perspectives"]) for c in campaigns for e in c["episodes"]) == 29
          PY
          python game.py start boothbay "$work/mythos.json" --seed 42 > "$work/opening.json"
          revision="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["revision"])' "$work/opening.json")"
          python game.py act "$work/mythos.json" inspect_docks --revision "$revision"
          python game.py inspect "$work/mythos.json" > "$work/inspected.json"
          cp "$work/mythos.json" "$work/before-recall.json"
          python game.py recap "$work/mythos.json" > "$work/recap.json"
          python game.py recall "$work/mythos.json" dock > "$work/recall.json"
          cmp "$work/mythos.json" "$work/before-recall.json"
          python - "$work" <<'PY'
          import json
          import sys
          from pathlib import Path
          work = Path(sys.argv[1])
          inspect, recap, recall = (json.loads((work / f"{name}.json").read_text())
                                    for name in ("inspected", "recap", "recall"))
          assert inspect["revision"] == recap["revision"] == recall["revision"]
          assert inspect["choices"] == recap["available_next_actions"]
          assert recap["audience"] == recall["audience"] == "player"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chat-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/chat-bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Assemble and verify standalone Conflagration draft package
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/conflagration-bundle"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/chat-bundle/runner-source.zip" "$out/"
          cp "$RUNNER_TEMP/chat-bundle/ENGINE_REVISION.txt" "$out/"
          cp "$RUNNER_TEMP/chat-bundle/SHA256SUMS" "$out/"
          cp 00_Meta/CONFLAGRATION_OFFLINE.md "$out/START_HERE.md"
          work="$(mktemp -d)"
          python -m zipfile -e "$out/runner-source.zip" "$work"
          cd "$work/age-simwar-runner"
          inventory=scenarios/sh44ser/conflagration/inventory.json
          python play.py private discover "$inventory" > "$work/menu.json"
          python - "$inventory" "$work/menu.json" <<'PY'
          import json
          import sys
          from age_runtime.core.draft_rehearsal import start_rehearsal
          from age_runtime.core.private_play import pending_factions, model_packet, model_choice, update, verify, decision_brief
          menu = json.load(open(sys.argv[2]))
          episodes = [e for g in menu["groups"] for e in g["episodes"]]
          assert len(episodes) == 7 and sum(len(e["perspectives"]) for e in episodes) == 25
          for episode in episodes:
              assert episode["play_mode"] == "rehearse"
              for actor in episode["perspectives"]:
                  session = start_rehearsal(sys.argv[1], episode["id"], actor["id"])
                  while not decision_brief(session)["complete"]:
                      for faction in pending_factions(session):
                          packet = model_packet(session, faction)
                          session = model_choice(session, faction, {"packet_id": packet["packet_id"], "action": None})
                      session = update(session, turns=1)
                  verify(session)
                  assert session["header"]["compiled"]["qualification"] == "unreviewed-rehearsal"
          PY
          python play.py private rehearse "$inventory" mainlander-ingress-regional-draft fiji "$work/session.json"
          python play.py private decision-brief "$work/session.json"
          cd "$out"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: conflagration-draft-${{ github.sha }}
          path: ${{ runner.temp }}/conflagration-bundle/
          if-no-files-found: error
          retention-days: 14
